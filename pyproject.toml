[project]
name = "coach-knux"
version = "0.1.0"
description = "AI Muay Thai striking coach with pose estimation, form analysis, and regression-tested evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe",
    "opencv-python",
    "numpy",
    "pandas",
    "scipy",
    "streamlit",
    "plotly",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pydantic",
    "python-dotenv",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]